<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splainr Games</title>
<style>
  body { margin: 0; font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", system-ui, sans-serif; background: linear-gradient(160deg, #e0f7ff, #fff3d6); color: #2b2d42; touch-action: manipulation; text-align: center; padding: 24px 12px; }
  h1 { color: #e63946; font-size: clamp(32px, 8vw, 54px); margin: 8px 0 20px; }
  .games { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
  .game { display: block; width: 240px; padding: 22px; border-radius: 24px; background: #fff; text-decoration: none; color: inherit; box-shadow: 0 6px 0 #c9ced6; }
  .game .icon { font-size: 72px; } .game .name { font-size: 28px; font-weight: 800; color: #1982c4; }
  .game .age { color: #777; } .soon { opacity: .5; box-shadow: none; }
</style>
</head>
<body>
  <h1>🎈 Splainr Games</h1>
  <div class="games">
    <a class="game" href="clock/"><div class="icon">⏰</div><div class="name">Clock Time!</div><div class="age">Learn to read a clock · ages 5–8</div></a>
    <div class="game soon"><div class="icon">✨</div><div class="name">More soon</div><div class="age">New games coming</div></div>
  </div>
</body>
</html>
